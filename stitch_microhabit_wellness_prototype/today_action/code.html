<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Today Action - MicroHabit</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error": "#ffffff",
                        "surface-container-low": "#f7f3ea",
                        "surface-dim": "#dddad1",
                        "background": "#fdf9f0",
                        "tertiary-fixed": "#b1ecff",
                        "secondary-fixed-dim": "#fbb5ac",
                        "surface-bright": "#fdf9f0",
                        "surface": "#fdf9f0",
                        "on-primary-fixed": "#002118",
                        "on-tertiary-fixed": "#001f27",
                        "on-primary-container": "#325f51",
                        "on-secondary": "#ffffff",
                        "tertiary-container": "#98d6ea",
                        "outline": "#717975",
                        "on-error-container": "#93000a",
                        "inverse-on-surface": "#f4f0e8",
                        "surface-container-high": "#ece8df",
                        "primary-fixed-dim": "#a1d1bf",
                        "inverse-surface": "#31312b",
                        "secondary-fixed": "#ffdad5",
                        "error-container": "#ffdad6",
                        "tertiary-fixed-dim": "#92d0e4",
                        "surface-container": "#f1eee5",
                        "on-surface": "#1c1c17",
                        "secondary": "#855049",
                        "secondary-container": "#feb8af",
                        "inverse-primary": "#a1d1bf",
                        "on-tertiary-container": "#175e6f",
                        "on-secondary-fixed-variant": "#6a3933",
                        "on-secondary-container": "#7a4640",
                        "on-primary-fixed-variant": "#214f41",
                        "on-secondary-fixed": "#350f0b",
                        "surface-variant": "#e6e2d9",
                        "on-primary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "primary-fixed": "#bcedda",
                        "on-background": "#1c1c17",
                        "surface-tint": "#3a6758",
                        "outline-variant": "#c0c8c3",
                        "on-surface-variant": "#404945",
                        "primary": "#3a6758",
                        "surface-container-highest": "#e6e2d9",
                        "on-tertiary-fixed-variant": "#004e5e",
                        "tertiary": "#236678",
                        "primary-container": "#a7d7c5",
                        "surface-container-lowest": "#ffffff",
                        "error": "#ba1a1a"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter-mobile": "16px",
                        "margin-mobile": "24px",
                        "stack-lg": "40px",
                        "stack-md": "24px",
                        "base": "8px",
                        "stack-sm": "12px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Plus Jakarta Sans"],
                        "label-sm": ["Plus Jakarta Sans"],
                        "headline-xl": ["Plus Jakarta Sans"],
                        "label-md": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "headline-xl": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body { background-color: theme('colors.background'); color: theme('colors.on-background'); }
        .glass-card {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0.1) 100%);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
        }
        .soft-glow {
            box-shadow: 0 0 24px rgba(167, 215, 197, 0.3); /* primary-container */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased min-h-screen flex flex-col items-center pt-24 pb-32 overflow-x-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 dark:bg-surface/80 backdrop-blur-md shadow-[0_10px_30px_rgba(0,0,0,0.04)] bg-gradient-to-b from-surface to-transparent dark:from-surface-container-highest dark:to-transparent">
<div class="flex justify-between items-center px-margin-mobile h-16 w-full max-w-[390px] mx-auto">
<button class="text-on-surface-variant hover:scale-105 transition-transform duration-300 active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<h1 class="font-headline-lg text-headline-lg text-primary dark:text-primary-fixed-dim tracking-tight">颈部拉伸</h1>
<div class="w-6 h-6"></div> <!-- Spacer -->
</div>
</header>
<!-- Main Canvas -->
<main class="w-full max-w-[390px] px-margin-mobile flex flex-col gap-stack-lg relative z-10">
<!-- Hero Visual Area -->
<section class="flex flex-col items-center justify-center pt-stack-md text-center">
<div class="relative w-40 h-40 mb-stack-md flex items-center justify-center">
<!-- Aura Glow -->
<div class="absolute inset-0 rounded-full bg-gradient-to-tr from-primary-container to-tertiary-container opacity-40 blur-xl animate-pulse"></div>
<!-- Central Icon Circle -->
<div class="relative w-32 h-32 rounded-full bg-surface-container-lowest glass-card flex items-center justify-center soft-glow z-10">
<span class="material-symbols-outlined text-[64px] text-primary" style="font-variation-settings: 'FILL' 0;">self_improvement</span>
</div>
</div>
<h2 class="font-headline-xl text-headline-xl text-primary mb-base">坐直，缓慢左右转头各 5 次。</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Focus on gentle movement.</p>
</section>
<!-- Steps Bento -->
<section class="grid grid-cols-1 gap-stack-sm">
<h3 class="font-label-md text-label-md text-outline px-2 uppercase tracking-wider">How to perform</h3>
<div class="bg-surface-container-lowest rounded-lg p-4 glass-card flex items-center gap-4">
<div class="w-8 h-8 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-label-md text-label-md shrink-0">1</div>
<p class="font-body-md text-body-md text-on-surface">坐在椅子前 1/2 处</p>
</div>
<div class="bg-surface-container-lowest rounded-lg p-4 glass-card flex items-center gap-4">
<div class="w-8 h-8 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-label-md text-label-md shrink-0">2</div>
<p class="font-body-md text-body-md text-on-surface">肩膀放松</p>
</div>
<div class="bg-surface-container-lowest rounded-lg p-4 glass-card flex items-center gap-4">
<div class="w-8 h-8 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-label-md text-label-md shrink-0">3</div>
<p class="font-body-md text-body-md text-on-surface">转头时保持慢速</p>
</div>
<div class="bg-surface-container-lowest rounded-lg p-4 glass-card flex items-center gap-4">
<div class="w-8 h-8 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-label-md text-label-md shrink-0">4</div>
<p class="font-body-md text-body-md text-on-surface">不要追求最大幅度</p>
</div>
</section>
<!-- Safety Notice -->
<section class="bg-secondary-container/30 rounded-lg p-5 flex items-start gap-4 border border-secondary-container/50">
<span class="material-symbols-outlined text-secondary mt-1 shrink-0" style="font-variation-settings: 'FILL' 1;">warning</span>
<div>
<h4 class="font-label-md text-label-md text-on-secondary-container mb-1">Safety First</h4>
<p class="font-body-md text-body-md text-on-secondary-container">如果出现疼痛、眩晕或明显不适，请停止。</p>
</div>
</section>
</main>
<!-- Bottom Actions Container -->
<div class="fixed bottom-0 w-full z-40 bg-gradient-to-t from-surface via-surface/90 to-transparent pt-12 pb-margin-mobile">
<div class="w-full max-w-[390px] mx-auto px-margin-mobile flex flex-col gap-stack-sm">
<button class="w-full py-4 rounded-full bg-gradient-to-b from-primary to-surface-tint text-on-primary font-headline-md text-headline-md shadow-[0_4px_14px_rgba(58,103,88,0.3)] hover:shadow-[0_6px_20px_rgba(58,103,88,0.4)] hover:-translate-y-0.5 transition-all duration-300 active:scale-95">
                我完成了
            </button>
<button class="w-full py-3 rounded-full bg-transparent text-primary font-label-md text-label-md hover:bg-surface-container-high transition-colors duration-300 active:scale-95">
                今天只做了 30 秒
            </button>
</div>
</div>
</body></html>
