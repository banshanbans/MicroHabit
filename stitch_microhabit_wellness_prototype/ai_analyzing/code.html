<style>
        body {

            background-color: #fdf9f0; /* fallback */

        .material-symbols-outlined {

        /* Custom animations for the analyzing state */

            animation: floatNode 4s ease-in-out infinite;

<body class="bg-surface text-on-surface antialiased flex flex-col items-center justify-center min-h-screen m-0 p-0 overflow-hidden">
<!-- 
      Note: TopAppBar and BottomNavBar are intentionally omitted. 
      This is a linear/transactional processing screen ("AI Analyzing"), 
      which requires suppressing the navigation shell to maintain focus. 
    -->
<main class="relative w-full max-w-[390px] h-[884px] flex flex-col justify-center px-margin-mobile bg-gradient-to-b from-surface to-surface-container-low overflow-hidden">
<!-- Ambient Background Glows -->
<div class="absolute top-[-10%] left-[-20%] w-72 h-72 bg-primary-container rounded-full mix-blend-multiply filter blur-3xl opacity-40 animate-pulse" style="animation-duration: 8s;"></div>
<div class="absolute bottom-[-10%] right-[-20%] w-80 h-80 bg-tertiary-container rounded-full mix-blend-multiply filter blur-3xl opacity-40 animate-pulse" style="animation-duration: 10s; animation-delay: 2s;"></div>
<!-- Header Area -->
<div class="flex flex-col items-center justify-center mb-stack-lg z-10 animate-float">
<!-- Central Node representing AI Brain / Seed -->
<div class="relative w-28 h-28 flex items-center justify-center mb-6">
<!-- Outer Glow Aura -->
<div class="absolute inset-0 bg-primary-container rounded-full blur-xl opacity-60 transition-colors duration-1000" id="core-aura" style="animation: gentlePulse 3s infinite;"></div>
<!-- Core Orb -->
<div class="relative w-16 h-16 bg-primary rounded-full flex items-center justify-center shadow-[0_10px_30px_rgba(58,103,88,0.3)] transition-all duration-700 ease-out z-10" id="core-orb">
<span class="material-symbols-outlined text-on-primary text-3xl transition-all duration-500" data-weight="fill" id="core-icon" style="font-variation-settings: 'FILL' 1;">
                        psychology
                    </span>
</div>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface text-center mb-2 transition-opacity duration-500" id="status-title">Analyzing Content</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center transition-opacity duration-500" id="status-desc">Discovering micro-habits...</p>
</div>
<!-- The Health Graph Steps -->
<div class="relative z-10 w-full max-w-[280px] mx-auto">
<!-- The connecting graph line -->
<div class="absolute left-[11px] top-4 bottom-4 w-[2px] bg-surface-variant rounded-full z-0">
<div class="absolute top-0 left-0 w-full bg-primary rounded-full transition-all duration-700 ease-out shadow-[0_0_8px_rgba(58,103,88,0.4)]" id="progress-line" style="height: 0%;"></div>
</div>
<!-- Steps Container -->
<div class="flex flex-col gap-6 relative z-10">
<!-- Step 1 -->

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const steps = document.querySelectorAll('.step');
            const progressLine = document.getElementById('progress-line');
            const coreOrb = document.getElementById('core-orb');
            const coreIcon = document.getElementById('core-icon');
            const coreAura = document.getElementById('core-aura');
            const statusTitle = document.getElementById('status-title');
            const statusDesc = document.getElementById('status-desc');
            
            const totalSteps = steps.length;
            let currentStep = 0;

            // Timing configuration
            const stepDuration = 1800; // ms per step
            const initialDelay = 800;

            function updateStepState(index) {
                if (index >= totalSteps) {
                    finishSequence();
                    return;
                }

                const stepEl = steps[index];
                const indicator = stepEl.querySelector('.indicator');
                const innerDot = stepEl.querySelector('.inner-dot');
                const text = stepEl.querySelector('.step-text');

                // 1. Activate current step
                stepEl.classList.remove('opacity-50');
                stepEl.classList.add('opacity-100');
                
                // Style the dot to look like an active graph node
                indicator.classList.remove('bg-surface-variant');
                indicator.classList.add('bg-primary', 'shadow-[0_0_12px_rgba(58,103,88,0.5)]');
                
                // Expand inner dot
                innerDot.classList.remove('w-0', 'h-0');
                innerDot.classList.add('w-2', 'h-2', 'animate-pulse');

                // Style text
                text.classList.remove('text-outline');
                text.classList.add('text-on-surface', 'font-bold');

                // 2. Mark previous step as completed
                if (index > 0) {
                    const prevStepEl = steps[index - 1];
                    const prevIndicator = prevStepEl.querySelector('.indicator');
                    const prevInnerDot = prevStepEl.querySelector('.inner-dot');
                    
                    // Remove glow and pulse from previous
                    prevIndicator.classList.remove('shadow-[0_0_12px_rgba(58,103,88,0.5)]');
                    prevInnerDot.classList.remove('animate-pulse');
                    
                    // Turn previous node into a solid dot or checkmark
                    prevInnerDot.parentElement.innerHTML = `<span class="material-symbols-outlined text-on-primary" style="font-size: 14px; font-variation-settings: 'FILL' 1;">check</span>`;
                }

                // 3. Update Progress Line connecting the nodes
                // Calculate percentage based on centers of the dots
                const progressPercentage = (index / (totalSteps - 1)) * 100;
                progressLine.style.height = `${progressPercentage}%`;

                // 4. Pulse central orb to simulate processing
                coreOrb.style.transform = 'scale(1.15)';
                setTimeout(() => {
                    coreOrb.style.transform = 'scale(1)';
                }, 300);

                // Schedule next step
                currentStep++;
                setTimeout(() => updateStepState(currentStep), stepDuration);
            }

            function finishSequence() {
                // Final state styling
                
                // Complete last step visual
                const lastStepEl = steps[totalSteps - 1];
                const lastIndicator = lastStepEl.querySelector('.indicator');
                lastIndicator.classList.remove('shadow-[0_0_12px_rgba(58,103,88,0.5)]');
                lastIndicator.innerHTML = `<span class="material-symbols-outlined text-on-primary" style="font-size: 14px; font-variation-settings: 'FILL' 1;">check</span>`;
                
                // Morph central orb to success state
                coreOrb.classList.remove('bg-primary', 'shadow-[0_10px_30px_rgba(58,103,88,0.3)]');
                coreOrb.classList.add('bg-tertiary', 'shadow-[0_10px_30px_rgba(35,102,120,0.3)]');
                
                coreIcon.innerText = 'check_circle';
                coreIcon.classList.remove('text-on-primary');
                coreIcon.classList.add('text-on-tertiary');
                
                coreAura.classList.remove('bg-primary-container');
                coreAura.classList.add('bg-tertiary-container');
                
                // Update text
                statusTitle.style.opacity = '0';
                statusDesc.style.opacity = '0';
                
                setTimeout(() => {
                    statusTitle.innerText = "Graph Generated";
                    statusDesc.innerText = "Ready to cultivate your garden.";
                    statusTitle.style.opacity = '1';
                    statusDesc.style.opacity = '1';
                    statusTitle.classList.add('text-tertiary');
                }, 500);
                
                // Note: In a real app, this would trigger a redirect or callback after a short delay
            }

            // Start the sequence
            setTimeout(() => updateStepState(0), initialDelay);
        });
    </script>
