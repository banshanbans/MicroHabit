<style>

<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center p-margin-mobile relative overflow-hidden antialiased">

<script>
        // Micro-interaction: Particle Burst on load
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('glow-container');
            const numParticles = 12;
            
            for (let i = 0; i < numParticles; i++) {
                createParticle(container, i, numParticles);
            }
        });

        function createParticle(container, index, total) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            
            // Randomize size
            const size = Math.random() * 8 + 4;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            
            // Center position
            particle.style.left = '50%';
            particle.style.top = '50%';
            
            container.appendChild(particle);

            // Calculate trajectory
            const angle = (index / total) * Math.PI * 2;
            const distance = Math.random() * 60 + 80;
            const tx = Math.cos(angle) * distance;
            const ty = Math.sin(angle) * distance;

            // Animate
            setTimeout(() => {
                particle.animate([
                    { transform: 'translate(-50%, -50%) scale(0)', opacity: 0.8 },
                    { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(1)`, opacity: 0 }
                ], {
                    duration: 1500 + Math.random() * 1000,
                    easing: 'cubic-bezier(0.25, 1, 0.5, 1)',
                    fill: 'forwards'
                });
            }, 400); // Delay to match node pop-in
        }
    </script>
