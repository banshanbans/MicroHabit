<style>
        .material-symbols-outlined {

        /* Custom glow animation for the recommended card */
        @keyframes subtle-pulse {

            70% { box-shadow: 0 0 0 15px rgba(177, 236, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(177, 236, 255, 0); }
        }
        
        .card-active {
            border-color: theme('colors.tertiary');
            background: linear-gradient(145deg, theme('colors.surface'), theme('colors.tertiary-container') 400%);
            box-shadow: 0 10px 30px rgba(152, 214, 234, 0.4), 0 0 0 2px theme('colors.tertiary');
            transform: scale(1);
            animation: subtle-pulse 3s infinite;
        }
        
        .card-inactive {
            border-color: transparent;
            background-color: theme('colors.surface-container-low');
            opacity: 0.8;
            transform: scale(0.98);
        }
        
        .card-inactive:hover {

<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.duration-card');
            
            cards.forEach(card => {
                card.addEventListener('click', () => {
                    // Remove active state from all
                    cards.forEach(c => {
                        c.classList.remove('card-active');
                        c.classList.add('card-inactive');
                    });
                    
                    // Add active state to clicked
                    card.classList.remove('card-inactive');
                    card.classList.add('card-active');
                    
                    // Optional: Haptic feedback for supported devices
                    if (window.navigator && window.navigator.vibrate) {
                        window.navigator.vibrate(50);
                    }
                });
            });
        });
    </script>
