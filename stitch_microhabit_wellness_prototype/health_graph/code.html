<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Health Graph Path Animations */
        .path-line {
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: drawPath 2s ease-out forwards;
        }
        
        .path-line-delay-1 { animation-delay: 0.5s; }
        .path-line-delay-2 { animation-delay: 1s; }
        .path-line-delay-3 { animation-delay: 1.5s; }

        @keyframes drawPath {
            to {
                stroke-dashoffset: 0;
            }
        }

        .node-pulse {
            animation: pulseGlow 3s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { filter: drop-shadow(0 0 4px rgba(167, 215, 197, 0.4)); }
            100% { filter: drop-shadow(0 0 12px rgba(167, 215, 197, 0.8)); }
        }

        .float-animation {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
