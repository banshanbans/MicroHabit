<script>
        // Simple script to toggle chip active states for demonstration of interactive tactility
        document.addEventListener('DOMContentLoaded', () => {
            const chips = document.querySelectorAll('.flex-wrap button:not(.bg-secondary-container\\/50):not(.bg-tertiary-container\\/50)');
            
            chips.forEach(chip => {
                chip.addEventListener('click', function() {
                    // Toggle active styles
                    if (this.classList.contains('border-primary/20')) {
                        // Deactivate
                        this.classList.remove('border-primary/20', 'text-primary', 'bg-transparent');
                        this.classList.add('border-outline-variant', 'text-on-surface-variant');
                    } else {
                        // Activate
                        this.classList.remove('border-outline-variant', 'text-on-surface-variant');
                        this.classList.add('border-primary/20', 'text-primary', 'bg-transparent', 'border-primary');
                        // Add a slight pop effect
                        this.style.transform = 'scale(0.95)';
                        setTimeout(() => this.style.transform = 'scale(1)', 150);
                    }
                });
            });
        });
    </script>
