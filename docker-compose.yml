services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: microhabit
      POSTGRES_USER: microhabit
      POSTGRES_PASSWORD: microhabit
    ports:
      - "5432:5432"
    volumes:
      - microhabit_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U microhabit -d microhabit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  microhabit_postgres:

